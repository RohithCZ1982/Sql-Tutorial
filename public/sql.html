<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SQL Window</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px}
    .CodeMirror{border:1px solid #ccc;height:180px;font-family:monospace;font-size:14px}
    table{border-collapse:collapse;width:100%;margin-top:12px}
    th,td{border:1px solid #ddd;padding:6px;text-align:left}
    .error{color:#a00;margin-top:8px}
    .hint-schema{color:#888;font-size:12px;margin-top:4px}
    button{padding:6px 14px;font-size:14px}
  </style>
</head>
<body>
  <h2>SQL Window</h2>
  <p>Type a SQL query below. Keywords, table names, and column names autocomplete as you type (or press Ctrl+Space).</p>
  <textarea id="sql">SELECT now() AS now;</textarea>
  <div style="margin-top:8px">
    <button id="run">Run</button>
    <span id="status"></span>
  </div>
  <div id="hintStatus" class="hint-schema"></div>
  <div id="result"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/sql-hint.min.js"></script>
  <script>
    const editor = CodeMirror.fromTextArea(document.getElementById('sql'), {
      mode: 'text/x-sql',
      lineNumbers: true,
      matchBrackets: true,
      extraKeys: { 'Ctrl-Space': 'autocomplete' },
      hintOptions: { tables: {}, completeSingle: false }
    });

    const hintStatus = document.getElementById('hintStatus');

    fetch('/schema')
      .then(res => res.json())
      .then(schema => {
        if (schema.error) throw new Error(schema.error);
        editor.setOption('hintOptions', { tables: schema, completeSingle: false });
        const tableCount = Object.keys(schema).length;
        hintStatus.textContent = tableCount
          ? `Schema loaded: ${tableCount} table(s) available for autocomplete.`
          : 'No tables found in the current database.';
      })
      .catch(err => { hintStatus.textContent = 'Could not load schema for autocomplete: ' + err.message; });

    function isAlphaKeyEvent(event) {
      const k = event.keyCode;
      return (k >= 65 && k <= 90) || (k >= 48 && k <= 57) || k === 190 || k === 189 || k === 32;
    }

    editor.on('keyup', (cm, event) => {
      if (!cm.state.completionActive && isAlphaKeyEvent(event)) {
        CodeMirror.commands.autocomplete(cm, CodeMirror.hint.sql, { completeSingle: false });
      }
    });

    const run = document.getElementById('run');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    run.addEventListener('click', async () => {
      status.textContent = ' Running...';
      result.innerHTML = '';
      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ sql: editor.getValue() })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Request failed');
        if (json.fields && json.fields.length > 0) {
          renderTable(json.fields, json.rows);
        } else {
          result.textContent = (json.command || 'OK') + ' — ' + json.rowCount + ' row(s) affected.';
        }
        status.textContent = '';
      } catch (err) {
        status.textContent = '';
        result.innerHTML = '<div class="error">' + err.message + '</div>';
      }
    });

    editor.setOption('extraKeys', {
      'Ctrl-Space': 'autocomplete',
      'Ctrl-Enter': () => run.click(),
      'Cmd-Enter': () => run.click()
    });

    function renderTable(fields, rows) {
      if (!rows || rows.length === 0) {
        result.textContent = 'No rows returned.';
        return;
      }
      const tbl = document.createElement('table');
      const thead = document.createElement('thead');
      const tr = document.createElement('tr');
      fields.forEach(f => { const th = document.createElement('th'); th.textContent = f; tr.appendChild(th); });
      thead.appendChild(tr);
      tbl.appendChild(thead);
      const tbody = document.createElement('tbody');
      rows.forEach(r => {
        const tr = document.createElement('tr');
        fields.forEach(f => { const td = document.createElement('td'); td.textContent = r[f]; tr.appendChild(td); });
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      result.appendChild(tbl);
    }
  </script>
</body>
</html>
